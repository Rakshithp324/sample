<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment - HomeFix</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #f0f4f8, #e4f0ff);
      color: #333;
    }

    header {
      background: linear-gradient(to right, #007bff, #00c6ff);
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    header h1 {
      font-size: 1.8rem;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 1.2rem;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: 6px;
      transition: background 0.3s ease;
    }

    nav a:hover,
    nav a.active {
      background-color: rgba(255, 255, 255, 0.2);
    }

    main {
      padding: 3rem 1rem;
      display: flex;
      justify-content: center;
    }

    .payment-container {
      width: 100%;
      max-width: 500px;
      background-color: #ffffff;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
    }

    .payment-container h2 {
      text-align: center;
      color: #28a745;
      font-size: 1.6rem;
      margin-bottom: 2rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    label {
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    input[type="text"] {
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
      background-color: #f9f9f9;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #28a745;
      background-color: #fff;
    }

    .button-container {
      display: flex;
      justify-content: center;
      margin-top: 1.5rem;
    }

    .button-container a {
      text-decoration: none;
      background-color: #28a745;
      color: white;
      padding: 0.8rem 2rem;
      border-radius: 10px;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    .button-container a:hover {
      background-color: #218838;
    }

    footer {
      background-color: #f1f1f1;
      text-align: center;
      padding: 1.2rem;
      font-size: 0.9rem;
      color: #666;
      margin-top: 3rem;
      border-top: 1px solid #ddd;
    }

    @media (max-width: 600px) {
      .payment-container {
        padding: 2rem 1.2rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>HomeFix</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="contactus.html">contact us</a>
      <a href="admin.html" >My Profile</a>
     
    </nav>
  </header>

  <main>
    <div class="payment-container">
      <h2>Payment</h2>
      <form onsubmit="event.preventDefault(); window.location.href='success.html';">
        <div>
          <label for="cardNumber">Card Number:</label>
          <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" required />
        </div>

        <div>
          <label for="expiry">Expiry Date:</label>
          <input type="text" id="expiry" placeholder="MM/YY" required />
        </div>

        <div>
          <label for="cvv">CVV:</label>
          <input type="text" id="cvv" placeholder="123" required />
        </div>

        <div>
          <label for="name">Cardholder Name:</label>
          <input type="text" id="name" placeholder="Full Name" required />
        </div>

        <div class="button-container">
          <a href="success.html">Pay</a>
        </div>
      </form>
    </div>
  </main>

  <footer>
    © 2025 HomeFix. All rights reserved.
  </footer>

</body>
</html>
